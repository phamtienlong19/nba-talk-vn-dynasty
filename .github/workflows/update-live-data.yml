name: Update Live Data

# The provisional live feed: this week's matchups, the standings if the week ended now, the playoff picture. Read-only GETs of Yahoo's
# public matchup pages (no sign-in, no cookies), about 9 requests. It writes ONE file, live.json, to the `live-data` branch as a single
# orphan commit (force-pushed, so that branch never grows). It never pushes to main, never opens a PR and never touches data/.
# The page fetches it from raw.githubusercontent.com and falls back to the embedded official weeks. Details: docs/LIVE_DATA.md
#
# GitHub cron is UTC and best-effort: scheduled runs often start 20-90 minutes late or not at all, so a 5-minute cron cannot keep a feed
# fresh. Each run therefore loops for ~115 minutes (a build + publish every 4 minutes); an hourly cron starts the next run, which waits
# in the queue until the previous one ends, so the feed has no gap. The page shows the feed's age and flags a stale one.
# Why it also queues its own successor: in practice GitHub dropped most of these cron triggers (runs began 6-8 hours apart, so the feed was
# fresh about 30% of the time). The first step therefore asks for the next run right away (workflow_dispatch is allowed with the job token);
# it waits in the concurrency queue until this one ends, so there is no gap, and the cron stays as a backstop if the chain ever breaks.
#   NBA games land about 22:00-07:00 UTC; weekend afternoons about 16:00-22:00 UTC; Yahoo's day and the waiver run roll over at
#   12:00 am Pacific = 08:00 UTC (07:00 UTC during US daylight time), so both of those minutes get a run.

on:
  schedule:
    - cron: "5,35 * * * *"
  push:                      # merging a change to the feed itself starts it at once (no waiting for GitHub's cron to notice)
    branches: [main]
    paths:
      - ".github/workflows/update-live-data.yml"
      - "scripts/live_feed_loop.sh"
      - "scripts/build_live_feed.py"
      - "scripts/yahoo_matchups.py"
      - "scripts/update_yahoo_matchups.py"
      - "scripts/live_standings.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: write             # to queue the next run (below)

# Never cancel the loop that is running; one newer run waits its turn (GitHub keeps only the newest pending run).
concurrency:
  group: update-live-data
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Queue the next run (it starts when this one ends; the cron is only the backstop)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-live-data.yml --ref "${GITHUB_REF_NAME}" || echo "could not queue the next run (the cron will)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and publish the feed every 4 minutes (live-data branch only; main is untouched)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/live_feed_loop.sh 6900 240
