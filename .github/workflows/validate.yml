name: validate

# Pull requests are checked on Linux only; main (after a merge) is also checked on macOS. A push to a PR branch is covered by the
# pull_request trigger, so `push` is limited to main. A newer push cancels the run it supersedes.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Validate site
        run: ./validate.sh

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Check for proprietary font binaries
        run: |
          if find . -type f \( -name "*.woff" -o -name "*.woff2" \) | grep -q .; then
            echo "Proprietary font binaries found in repo:"
            find . -type f \( -name "*.woff" -o -name "*.woff2" \)
            exit 1
          fi
          echo "No font binaries tracked."
