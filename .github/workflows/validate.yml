name: validate

# Pull requests are checked on Linux only; main (after a merge) is also checked on macOS. A push to a PR branch is covered by the
# pull_request trigger, so `push` is limited to main. A newer push cancels the run it supersedes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:                 # lets the Heal Generated Conflicts workflow start the checks on a branch it pushed (built-in-token pushes start none)

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Validate site
        run: ./validate.sh

      # A roster PR only adds a roster snapshot; its run already passed validate + the roster/ownership tests, and the bot waits for THIS check before it
      # merges, so the browser UI suite (many minutes) would be most of the time a roster change takes to reach the site. main (after the merge) and the nightly
      # run still run everything.
      - name: Run tests
        if: ${{ !startsWith(github.head_ref, 'automation/yahoo-rosters-') }}
        run: python3 -m unittest discover -s tests -v

      - name: Run the roster tests (roster PRs; the full suite runs on main and nightly)
        if: ${{ startsWith(github.head_ref, 'automation/yahoo-rosters-') }}
        run: |
          python3 -m unittest discover -s tests -p "test_*roster*.py"
          python3 -m unittest discover -s tests -p "test_season_ops.py"
          python3 -m unittest discover -s tests -p "test_league_state_data.py"

      - name: Check for proprietary font binaries
        run: |
          if find . -type f \( -name "*.woff" -o -name "*.woff2" \) | grep -q .; then
            echo "Proprietary font binaries found in repo:"
            find . -type f \( -name "*.woff" -o -name "*.woff2" \)
            exit 1
          fi
          echo "No font binaries tracked."
