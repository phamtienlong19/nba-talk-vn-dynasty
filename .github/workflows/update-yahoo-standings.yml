name: Update Yahoo Standings

# Manual only (no schedule). Reads the league's public standings page with ONE plain GET (no sign-in, no cookies), validates it with
# the same importer as the saved-HTML path, and either opens a pull request or publishes a report. It never pushes to main and
# never merges. Procedure and limits: docs/STANDINGS_REFRESH.md

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Open a PR when the update is READY (only when run from main)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-yahoo-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPLY: ${{ inputs.open_pr && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch, validate and compare
        id: update
        run: |
          args="--engine http --out artifacts/yahoo-standings-update"
          if [ "$APPLY" = "true" ]; then args="$args --apply"; fi
          python3 scripts/update_yahoo_standings.py $args

      - name: Publish the report
        if: always()
        run: |
          if [ -f artifacts/yahoo-standings-update/report.md ]; then
            cat artifacts/yahoo-standings-update/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was produced: the run stopped before it could write one. See the log above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate the regenerated site and run the tests
        if: steps.update.outputs.outcome == 'READY' && env.APPLY == 'true'
        run: |
          python3 -m pip install -r requirements.txt
          ./validate.sh
          python3 -m unittest discover -s tests

      - name: Only standings data and the generated site may have changed
        if: steps.update.outputs.outcome == 'READY' && env.APPLY == 'true'
        run: |
          bad=$(git status --porcelain | awk '{print $2}' | grep -vE '^(data/2026-27/standings/|index\.html$)' || true)
          if [ -n "$bad" ]; then
            echo "::error title=Unexpected changes::A standings update may not touch: $bad"
            exit 1
          fi

      - name: Open a pull request
        if: steps.update.outputs.outcome == 'READY' && env.APPLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.update.outputs.snapshot }}
        run: |
          branch="automation/yahoo-standings-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/2026-27/standings index.html
          git commit -m "data: Yahoo standings update (automated)" \
                     -m "Generated by the Update Yahoo Standings workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Review before merging."
          git push origin "$branch"
          { echo "> Not merged automatically. Review the report, then merge or close."; echo; head -c 60000 artifacts/yahoo-standings-update/report.md; } > artifacts/pr-body.md
          gh pr create --base main --head "$branch" --title "Yahoo standings update" --body-file artifacts/pr-body.md
