name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize trusted Issue context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/materialize_issue_context.py --event "$GITHUB_EVENT_PATH" --output ".issue-context"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allows Claude to read CI results on PRs.
          additional_permissions: |
            actions: read

          # Temporary while hardening/debugging the GitHub-native workflow.
          show_full_output: true

          # Narrow allowlist for this repo's standard validation/status commands.
          claude_args: >-
            --verbose
            --allowedTools "Bash(./validate.sh),Bash(python3 -m unittest discover -s tests),Bash(./handoff.sh),Bash(./status.sh)"

          # Optional: Give a custom prompt to Claude. If this is not specified,
          # Claude performs the instructions in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'
