name: Update Player Metadata

# Keeps the DISPLAY metadata of players current: NBA team, position eligibility (incl. IL eligibility) and the league-wide status table, from Yahoo's
# public draft-analysis endpoint (no sign-in, no cookies, read-only GET). Position eligibility changes all season (a player gains PG/SG after enough
# games) and the roster checks, trade checker and cards all read it, but nothing refreshed it automatically: it sat at 2026-10-20 until someone ran
# scripts/refresh_player_metadata.py by hand. Opens a PR (never merges, never touches ownership, ranks or prices) when something changed.
# Details: docs/YAHOO_DATA_SOURCE.md, "Metadata refresh".

on:
  schedule:
    - cron: "25 1,5,9,13,17,21 * * *"     # every 4 hours (was daily): IL eligibility decides injured vs healthy-on-IL, and it changes through the day
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Open a PR when something changed (only when run from main)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-player-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPLY: ${{ (github.event_name == 'schedule' || inputs.open_pr) && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read Yahoo's current metadata
        id: refresh
        run: |
          if [ "$APPLY" = "true" ]; then
            python3 scripts/refresh_player_metadata.py --write | tee artifacts-refresh.txt
          else
            python3 scripts/refresh_player_metadata.py | tee artifacts-refresh.txt
          fi
          if [ -n "$(git status --porcelain data/yahoo)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; echo "NO_CHANGE: Yahoo's metadata matches the repository." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Regenerate the page, validate and run the tests
        if: steps.refresh.outputs.changed == 'true' && env.APPLY == 'true'
        run: |
          python3 -m pip install -r requirements.txt
          python3 scripts/refresh_card_positions.py
          ./validate.sh
          python3 -m unittest discover -s tests

      - name: Only the metadata files and the generated page may have changed
        if: steps.refresh.outputs.changed == 'true' && env.APPLY == 'true'
        run: |
          bad=$(git status --porcelain | awk '{print $2}' | grep -vE '^(data/yahoo/player_registry\.json|data/yahoo/player_status\.json|index\.html|artifacts-refresh\.txt)$' || true)
          if [ -n "$bad" ]; then
            echo "::error title=Unexpected changes::A metadata refresh may not touch: $bad"
            exit 1
          fi

      - name: Open a pull request
        if: steps.refresh.outputs.changed == 'true' && env.APPLY == 'true'
        env:
          ROSTER_PR_TOKEN: ${{ secrets.ROSTER_PR_TOKEN }}
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          source scripts/bot_pr.sh
          bot_pr_token
          branch="automation/player-metadata-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/yahoo/player_registry.json data/yahoo/player_status.json index.html
          git commit -m "data: refresh player metadata from Yahoo (automated)" \
                     -m "Generated by the Update Player Metadata workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Display data only: NBA team, position eligibility, statuses."
          git push origin "$branch"
          { echo "> Opened with $BOT_PR_OPENER; merges itself once its checks are green (docs/BOT_PRS.md). Display data only (NBA team, position eligibility, IL eligibility, statuses); ownership, ranks and prices never change."; echo; echo '```'; head -c 60000 artifacts-refresh.txt; echo '```'; } > pr-body.md
          pr_url=$(gh pr create --base main --head "$branch" --title "Player metadata refresh (positions, team, statuses)" --body-file pr-body.md)
          echo "Opened $pr_url" >> "$GITHUB_STEP_SUMMARY"
          new_pr="${pr_url##*/}"
          # an older open metadata PR is stale the moment a newer one exists
          for old in $(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("automation/player-metadata-")) | .number'); do
            if [ "$old" != "$new_pr" ]; then
              gh pr close "$old" --delete-branch --comment "Superseded by #$new_pr, a newer metadata refresh."
            fi
          done
          bot_pr_merge "$new_pr"
